<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChemInfo Pro - Geleceğin Kimya Asistanı</title>
    
    <style>
        :root {
            --color-primary-400: 34 211 238;
            --color-primary-500: 6 182 212;
            --color-primary-600: 8 145 178;
            --color-surface-900: 8 12 20;
            --color-surface-800: 15 23 42;
            --color-text-main: 248 250 252;
            --color-text-muted: 148 163 184;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: rgb(var(--color-surface-900));
            color: rgb(var(--color-text-main));
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(var(--color-primary-500), 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(var(--color-primary-600), 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Cam Paneller için Ultra Derinlik */
        .glass-panel {
            background: rgba(var(--color-surface-800), 0.45);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Akıcı Parçacık Efekti (Pseudo) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='2' cy='2' r='1' fill='white' fill-opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: -1;
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; }
            .printable-content { box-shadow: none !important; border: 1px solid #eee !important; background: white !important; }
            .prose { color: black !important; }
        }
    </style>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.1/3Dmol-min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 400: 'rgb(var(--color-primary-400))', 500: 'rgb(var(--color-primary-500))', 600: 'rgb(var(--color-primary-600))' },
                        surface: { 900: 'rgb(var(--color-surface-900))', 800: 'rgb(var(--color-surface-800))' },
                    },
                    borderRadius: { '4xl': '2rem', '5xl': '3rem' }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script type="importmap">
    {
      "imports": {
        "react": "https://aistudiocdn.com/react@^19.1.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
        "react/": "https://aistudiocdn.com/react@^19.1.1/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.19.0"
      }
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
